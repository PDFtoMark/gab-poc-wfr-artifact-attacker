name: ADP Target PR validation
on:
  pull_request:
jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "SPOOFED_NAME_ONLY_MATCH_$(date +%s)" > linter-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            pr-number.txt
            linter-report.txt
