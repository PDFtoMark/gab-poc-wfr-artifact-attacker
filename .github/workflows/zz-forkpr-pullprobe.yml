name: zz ForkPR PullProbe
on:
  workflow_run:
    workflows: ["Release notes"]
    types: [completed]
permissions: {}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: payload
        run: |
          echo "PR_JSON=${{ toJSON(github.event.workflow_run.pull_requests) }}"
          echo "PR0_NULL=${{ github.event.workflow_run.pull_requests[0] == null }}"
          echo "HEAD_REPO=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "UP_RUN_ID=${{ github.event.workflow_run.id }}"
